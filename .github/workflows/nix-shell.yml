# Builds the Nix shell on Linux (x86_64, aarch64) and macOS, then checks
# that the tools are on PATH and that a program using the bigraph library
# compiles and runs. Windows users run the Linux shell under WSL2.
name: nix-shell

# Runs on pull requests and on master, only when the shell's inputs change.
# Run it by hand from the Actions tab for any other branch.
on:
  push:
    branches: [master]
    paths:
      - shell.nix
      - nix/**
      - bigraph-tools
      - .github/workflows/nix-shell.yml
  pull_request:
    paths:
      - shell.nix
      - nix/**
      - bigraph-tools
      - .github/workflows/nix-shell.yml
  workflow_dispatch:

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    # bigrapher, and on Linux a few OCaml tools, are built from source on
    # every run (they are not in the public binary cache); the rest comes
    # from cache.nixos.org.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: cachix/install-nix-action@v31
        with:
          # nix-shell runs its shell with bashInteractive from <nixpkgs>, or
          # with the bash on PATH if there is no <nixpkgs>. On macOS that is
          # Bash 3.2, which nixpkgs rejects, so the shell fails to start.
          # Use the nixpkgs that shell.nix pins; keep the two in sync.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/25.05.tar.gz

      - name: Build the shell
        run: nix-shell --run true

      - name: Check tools are on PATH
        run: |
          # Single quotes: the inner shell, inside nix-shell, expands the variables.
          # shellcheck disable=SC2016
          nix-shell --run '
            set -e
            for tool in ocaml dune bigrapher prism mcrl22lps pbessolve dot jq; do
              command -v "$tool"
            done
          '

      - name: Compile and run a program that uses bigraph
        run: |
          # Single quotes: the inner shell, inside nix-shell, expands the variables.
          # shellcheck disable=SC2016
          nix-shell --run '
            set -euo pipefail
            dir=$(mktemp -d)
            echo "(lang dune 3.0)" > "$dir/dune-project"
            echo "(executable (name main) (libraries bigraph))" > "$dir/dune"
            echo "let () = print_endline (Bigraph.Big.to_string Bigraph.Big.one)" > "$dir/main.ml"
            dune exec --root "$dir" ./main.exe
          '
